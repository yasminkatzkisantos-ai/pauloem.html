<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Store | Do RN ao 06 anos</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #ff6b6b;
            --secondary: #4ecdc4;
            --accent: #ffe66d;
            --dark: #2f2f2f;
            --boys: #4a90e2;
            --girls: #f06292;
        }

        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            background-color: #f9f9f9;
        }

        header {
            background: var(--primary);
            color: white;
            padding: 1.5rem;
            text-align: center;
            font-family: 'Fredoka One', cursive;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .promo-banner {
            background: var(--accent);
            padding: 10px;
            text-align: center;
            font-weight: bold;
            color: var(--dark);
        }

        /* Filtros */
        .filtros {
            text-align: center;
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-filtro {
            padding: 10px 20px;
            border-radius: 25px;
            border: 2px solid var(--secondary);
            background: white;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-filtro.active {
            background: var(--secondary);
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }

        .catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .produto-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
            border: 1px solid #eee;
        }

        .produto-card:hover { transform: translateY(-5px); }

        .produto-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: bold;
            color: white;
        }

        button {
            background: var(--secondary);
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }

        .carrinho-area {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            height: sticky;
            top: 20px;
        }

        .item-carrinho {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
            border-bottom: 1px dashed #eee;
            padding-bottom: 5px;
        }

        #qrcode { margin-top: 20px; text-align: center; }
        .hidden { display: none; }
    </style>
</head>
<body>

<header>
    <h1>🧸 KIDS STORE 🎈</h1>
    <p>Roupas e Brinquedos para seus pequenos!</p>
</header>

<div class="promo-banner">
    🚀 PROMOÇÃO: 10% de DESCONTO no PIX em toda a loja!
</div>

<div class="filtros">
    <button class="btn-filtro active" onclick="filtrar('todos')">Todos</button>
    <button class="btn-filtro" onclick="filtrar('menino')">Meninos</button>
    <button class="btn-filtro" onclick="filtrar('menina')">Meninas</button>
    <button class="btn-filtro" onclick="filtrar('brinquedo')">Brinquedos</button>
</div>

<div class="container">
    <section class="catalogo" id="catalogo"></section>

    <aside class="carrinho-area">
        <h3>🛒 Carrinho</h3>
        <div id="itens-lista"></div>
        <hr>
        <h4>Total: R$ <span id="valor-total">0.00</span></h4>
        <button id="btn-pagar" style="background: var(--primary);">Finalizar via PIX</button>

        <div id="area-pagamento" class="hidden">
            <div id="qrcode"></div>
            <p id="pix-copy" style="word-break: break-all; font-size: 0.7rem; color: #666;"></p>
        </div>
    </aside>
</div>

<script>
    const produtos = [
        // MENINOS
        { id: 1, nome: "Conjunto Bege Verão", preco: 79.90, cat: "menino", desc: "Tamanho: 1 a 4 anos" },
        { id: 2, nome: "Body RN Listrado", preco: 45.00, cat: "menino", desc: "Tamanho: RN e P" },
        { id: 3, nome: "Jardineira Jeans", preco: 110.00, cat: "menino", desc: "Tamanho: 2 a 6 anos" },
        
        // MENINAS
        { id: 4, nome: "Vestido Floral Luxo", preco: 95.00, cat: "menina", desc: "Tamanho: 1 a 6 anos" },
        { id: 5, nome: "Conjunto Moletom Rosa", preco: 120.00, cat: "menina",  desc: "Tamanho: 2 a 4 anos" },
        { id: 6, nome: "Sapatinho de Princesa", preco: 59.90, cat: "menina",  desc: "Tamanho: 14 ao 20" },

        // BRINQUEDOS
        { id: 7, nome: "Ursinho Soft Gigante", preco: 89.90, cat: "brinquedo", desc: "Antialérgico" },
        { id: 8, nome: "Blocos Educativos", preco: 65.00, cat: "brinquedo",  desc: "Madeira Reflorestada" },
        { id: 9, nome: "Cozinha Infantil", preco: 199.00, cat: "brinquedo", desc: "Com acessórios" }
    ];

    let carrinho = [];

    function renderCatalogo(filtro = 'todos') {
        const catalogoDiv = document.getElementById('catalogo');
        catalogoDiv.innerHTML = "";
        
        const listaFiltrada = filtro === 'todos' ? produtos : produtos.filter(p => p.cat === filtro);

        listaFiltrada.forEach(p => {
            const corTag = p.cat === 'menino' ? 'var(--boys)' : (p.cat === 'menina' ? 'var(--girls)' : 'orange');
            catalogoDiv.innerHTML += `
                <div class="produto-card">
                    <img src="${p.img}" alt="${p.nome}">
                    <span class="tag" style="background:${corTag}">${p.cat}</span>
                    <h3 style="margin:10px 0 5px 0; font-size:1.1rem">${p.nome}</h3>
                    <small>${p.desc}</small>
                    <p style="color:var(--primary); font-weight:bold; font-size:1.2rem">R$ ${p.preco.toFixed(2)}</p>
                    <button onclick="adicionar(${p.id})">Adicionar ao Carrinho</button>
                </div>
            `;
        });
    }

    function filtrar(categoria) {
        document.querySelectorAll('.btn-filtro').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        renderCatalogo(categoria);
    }

    function adicionar(id) {
        const prod = produtos.find(p => p.id === id);
        carrinho.push(prod);
        renderCarrinho();
    }

    function renderCarrinho() {
        const lista = document.getElementById('itens-lista');
        const totalSpan = document.getElementById('valor-total');
        lista.innerHTML = "";
        let total = 0;

        carrinho.forEach((item) => {
            total += item.preco;
            lista.innerHTML += `
                <div class="item-carrinho">
                    <span>${item.nome}</span>
                    <span>R$ ${item.preco.toFixed(2)}</span>
                </div>
            `;
        });
        totalSpan.innerText = total.toFixed(2);
    }

    document.getElementById('btn-pagar').addEventListener('click', function() {
        const total = document.getElementById('valor-total').innerText;
        if(total == "0.00") return alert("Seu carrinho está vazio!");

        document.getElementById('area-pagamento').classList.remove('hidden');
        document.getElementById('qrcode').innerHTML = "";

        const payload = `00020126330014BR.GOV.BCB.PIX0114suachave@pix5204000053039865405${total}5802BR5913KidsStore6008Curitiba62070503***6304`;

        new QRCode(document.getElementById("qrcode"), {
            text: payload,
            width: 160,
            height: 160
        });

        document.getElementById('pix-copy').innerText = "Chave: " + payload.substring(0, 35) + "...";
    });

    // Iniciar site
    renderCatalogo();
</script>

</body>
</html>
